<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sonic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#10B981;--accent2:#34D399;--bg:#000;--surface:#0A0A0A;
    --text:#F5F5F5;--muted:#A3A3A3;--glass:rgba(255,255,255,0.03);
    --glass-border:rgba(255,255,255,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{width:100%;height:100%;background:#000;color:var(--text);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

  /* Header */
  .header{flex-shrink:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(8,8,8,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);z-index:100}
  .logo{display:flex;align-items:center;gap:8px}
  .logo-icon{width:24px;height:24px;color:var(--accent);filter:drop-shadow(0 0 6px rgba(16,185,129,0.4));transition:color .3s}
  .logo-icon svg{width:100%;height:100%;fill:currentColor}
  .logo-text{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.3px}
  .hbtns{display:flex;gap:6px}
  .hbtn{background:var(--glass);border:1px solid var(--glass-border);color:var(--text);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;backdrop-filter:blur(10px);transition:all .2s}
  .hbtn:active{transform:scale(0.95)}
  .hbtn.active{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.3);color:var(--accent)}
  .dropdown{position:relative}
  .dd-menu{position:absolute;top:calc(100% + 5px);right:0;background:rgba(10,10,10,0.98);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:12px;padding:5px;min-width:150px;max-height:55vh;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-5px);transition:all .2s;z-index:300;box-shadow:0 10px 36px rgba(0,0,0,0.55)}
  .dropdown.open .dd-menu{opacity:1;visibility:visible;transform:translateY(0)}
  .dd-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;transition:all .15s}
  .dd-item:hover{background:rgba(255,255,255,0.04)}
  .dd-item.active{color:var(--accent)}
  .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  /* Visualizer */
  .viz-wrap{flex:1;position:relative;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #vizCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
  .viz-overlay{position:absolute;top:10px;left:12px;pointer-events:none;opacity:0;transform:translateY(6px);transition:all .4s ease}
  .viz-overlay.show{opacity:1;transform:translateY(0)}
  .viz-label{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin-bottom:2px}
  .viz-name{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600}

  /* Empty state */
  .empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:5;transition:opacity .5s}
  .empty-state.hide{opacity:0}
  .empty-wave{width:160px;height:40px;display:flex;align-items:flex-end;justify-content:center;gap:3px;margin-bottom:20px}
  .ew-bar{width:3px;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:3px;animation:ew 1.6s ease-in-out infinite}
  @keyframes ew{0%,100%{height:12%;opacity:.25}50%{height:100%;opacity:1}}
  .empty-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px}
  .empty-sub{font-size:13px;color:var(--muted)}

  /* Player */
  .player{flex-shrink:0;background:rgba(8,8,8,0.95);backdrop-filter:blur(30px);border-top:1px solid var(--glass-border);padding:10px 14px 12px;z-index:100}
  .p-track{text-align:center;margin-bottom:8px}
  .p-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-artist{font-size:11px;color:var(--muted);margin-top:1px}
  .p-ctrls{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:8px}
  .pcb{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .pcb:active{transform:scale(0.88);color:var(--text)}
  .pcb.play{width:48px;height:48px;background:#fff;color:#000;box-shadow:0 0 20px rgba(255,255,255,0.12)}
  .pcb.play:active{transform:scale(0.9)}
  .pcb svg{width:20px;height:20px}
  .pcb.play svg{width:18px;height:18px}
  .p-prog{display:flex;align-items:center;gap:8px}
  .p-bar{flex:1;height:3px;background:var(--glass);border-radius:3px;cursor:pointer;position:relative;overflow:hidden}
  .p-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;width:0%;transition:width .08s linear}
  .ptxt{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:center}

  /* Bottom action bar */
  .b-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(6,6,6,0.98);border-top:1px solid var(--glass-border);z-index:100}
  .b-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);padding:8px 0;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s}
  .b-btn:active{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.25);transform:scale(0.97)}
  .b-btn svg{width:14px;height:14px}

  /* Slide-up playlist panel */
  .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:400;opacity:0;visibility:hidden;transition:all .3s ease}
  .panel-overlay.open{opacity:1;visibility:visible}
  .panel{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,0.98);backdrop-filter:blur(24px);border-top:1px solid var(--glass-border);border-radius:20px 20px 0 0;max-height:65vh;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:401;display:flex;flex-direction:column}
  .panel.open{transform:translateY(0)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .panel-t{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .panel-x{width:28px;height:28px;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
  .panel-x:active{background:rgba(255,255,255,0.06)}
  .panel-list{flex:1;overflow-y:auto;padding:0 12px 20px}
  .pl-item2{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all .2s;border:1px solid transparent;position:relative;margin-bottom:3px}
  .pl-item2:active{background:var(--glass)}
  .pl-item2.active{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.12)}
  .pl-item2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 3px 3px 0;transform:scaleY(0);transition:transform .3s}
  .pl-item2.active::before{transform:scaleY(1)}
  .pl-num2{width:22px;text-align:center;font-size:12px;color:var(--muted);flex-shrink:0}
  .pl-item2.active .pl-num2{color:var(--accent)}
  .pl-info2{flex:1;min-width:0}
  .pl-name2{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-dur2{font-size:11px;color:var(--muted)}
  .pl-del2{width:28px;height:28px;border-radius:8px;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s}
  .pl-item2:active .pl-del2,.pl-item2:hover .pl-del2{opacity:1}
  .pl-del2:active{background:rgba(239,68,68,0.12);color:#ef4444}
  .pl-del2 svg{width:14px;height:14px}

  /* Toast */
  .toast-box{position:fixed;top:12px;left:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast{background:rgba(12,12,12,0.98);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,0.5);transform:translateY(-16px);opacity:0;transition:all .35s;pointer-events:auto}
  .toast.in{transform:translateY(0);opacity:1}
  .toast svg{width:16px;height:16px;flex-shrink:0}
  .toast.ok svg{color:var(--accent)}.toast.bad svg{color:#ef4444}
  .toast-msg{font-size:12px;font-weight:500}

  /* Loader */
  .loader{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
  .loader.done{opacity:0;visibility:hidden}
  .loader-logo{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-bottom:18px;color:var(--text);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .loader-track{width:120px;height:2px;background:var(--glass);border-radius:2px;overflow:hidden}
  .loader-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:load 1.2s ease-out forwards}
  @keyframes load{to{width:100%}}

  .panel-list::-webkit-scrollbar{width:2px}
  .panel-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}

  @media(min-width:768px){
    .app{max-width:480px;margin:0 auto;border-left:1px solid var(--glass-border);border-right:1px solid var(--glass-border)}
    .panel{left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;border-radius:20px 20px 0 0}
    .panel.open{transform:translate(-50%,0)}
  }
</style>
</head>
<body>

<div class="loader" id="loader"><div class="loader-logo">Sonic</div><div class="loader-track"><div class="loader-fill"></div></div></div>
<div class="toast-box" id="toastBox"></div>

<div class="app" id="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon" id="logoIcon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <span class="logo-text">Sonic</span>
    </div>
    <div class="hbtns">
      <div class="dropdown" id="ddViz">
        <button class="hbtn" id="btnViz">Mode</button>
        <div class="dd-menu">
          <div class="dd-item" data-mode="wavemesh">Wave Mesh</div>
          <div class="dd-item active" data-mode="oscilloscope">Oscilloscope</div>
          <div class="dd-item" data-mode="bars">Frequency Bars</div>
          <div class="dd-item" data-mode="particles">Particles</div>
          <div class="dd-item" data-mode="fourier">Fourier Wave</div>
        </div>
      </div>
      <div class="dropdown" id="ddTheme">
        <button class="hbtn" id="btnTheme">Color</button>
        <div class="dd-menu">
          <div class="dd-item active" data-theme="emerald"><span class="cdot" style="background:#10B981"></span>Emerald</div>
          <div class="dd-item" data-theme="azure"><span class="cdot" style="background:linear-gradient(90deg,#4F46E5,#2563EB)"></span>Azure</div>
          <div class="dd-item" data-theme="blush"><span class="cdot" style="background:linear-gradient(90deg,#8B5CF6,#F472B6)"></span>Blush</div>
        </div>
      </div>
    </div>
  </header>

  <div class="viz-wrap">
    <canvas id="vizCanvas"></canvas>
    <div class="empty-state" id="emptyState">
      <div class="empty-wave" id="emptyWave"></div>
      <div class="empty-title">Turn your music into motion.</div>
      <div class="empty-sub">Drop your music here.</div>
    </div>
    <div class="viz-overlay" id="vizOverlay">
      <div class="viz-label">Visualizer</div>
      <div class="viz-name" id="vizName">Oscilloscope</div>
    </div>
  </div>

  <div class="player">
    <div class="p-track">
      <div class="p-title" id="pTitle">No track selected</div>
      <div class="p-artist" id="pArtist">Upload to begin</div>
    </div>
    <div class="p-ctrls">
      <button class="pcb" id="btnShuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="pcb" id="btnPrev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="pcb play" id="btnPlay" title="Play/Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor" id="iconPause" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="pcb" id="btnNext" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="pcb" id="btnRepeat" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
      </button>
    </div>
    <div class="p-prog">
      <span class="ptxt" id="txtCurr">0:00</span>
      <div class="p-bar" id="pBar"><div class="p-fill" id="pFill"></div></div>
      <span class="ptxt" id="txtTot">0:00</span>
    </div>
  </div>

  <div class="b-bar">
    <button class="b-btn" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Add Music
    </button>
    <button class="b-btn" id="songsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13M9 18c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-3c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
      Songs <span id="songsCount" style="margin-left:4px;opacity:.6">(0)</span>
    </button>
    <input type="file" id="fileIn" accept="audio/*" multiple style="display:none">
  </div>
</div>

<div class="panel-overlay" id="panelOverlay"></div>
<div class="panel" id="panel">
  <div class="panel-h">
    <span class="panel-t">Your Songs</span>
    <button class="panel-x" id="panelX">&#10005;</button>
  </div>
  <div class="panel-list" id="panelList"></div>
</div>

<script>

// ==================== STATE ====================
const S = {
  tracks: [], curIdx: -1, playing: false,
  shuffle: false, repeat: false, muted: false, vol: 0.8,
  mode: 'oscilloscope', theme: 'emerald', hue: 0,
  ctx: null, analyser: null, src: null,
  audio: new Audio(), db: null, af: null,
  particles: [], prevFreq: null,
  barState: null
};

const THEMES = {
  emerald: { p: '#10B981', s: '#34D399' },
  azure:   { p: '#4F46E5', s: '#2563EB' },
  blush:   { p: '#8B5CF6', s: '#F472B6' }
};

function getColors() {
  if (S.theme === 'emerald') return THEMES.emerald;
  if (S.theme === 'azure') return THEMES.azure;
  if (S.theme === 'blush') return THEMES.blush;
  return THEMES.emerald;
}

function updateLogoColor(col) {
  const icon = document.getElementById('logoIcon');
  if (icon) icon.style.color = col.p;
}

// ==================== INDEXEDDB ====================
const DBN = 'SonicDB4', STO = 'tracks';
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DBN, 1);
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { S.db = r.result; res(); };
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STO)) {
        const s = db.createObjectStore(STO, { keyPath: 'id', autoIncrement: true });
        s.createIndex('createdAt', 'createdAt', { unique: false });
      }
    };
  });
}
function dbAdd(t) {
  return new Promise((res, rej) => {
    const tx = S.db.transaction(STO, 'readwrite');
    const r = tx.objectStore(STO).add(t);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbAll() {
  return new Promise((res, rej) => {
    const tx = S.db.transaction(STO, 'readonly');
    const r = tx.objectStore(STO).getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbDel(id) {
  return new Promise((res, rej) => {
    const tx = S.db.transaction(STO, 'readwrite');
    const r = tx.objectStore(STO).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbClean() {
  const cut = Date.now() - 24*60*60*1000;
  const tx = S.db.transaction(STO, 'readwrite');
  const st = tx.objectStore(STO);
  const idx = st.index('createdAt');
  const req = idx.openCursor(IDBKeyRange.upperBound(cut));
  req.onsuccess = e => { const c = e.target.result; if (c) { st.delete(c.value.id); c.continue(); } };
}

// ==================== AUDIO ====================
function initAudio() {
  if (!S.ctx) {
    S.ctx = new (window.AudioContext || window.webkitAudioContext)();
    S.analyser = S.ctx.createAnalyser();
    S.analyser.fftSize = 4096;
    S.analyser.smoothingTimeConstant = 0.82;
    S.src = S.ctx.createMediaElementSource(S.audio);
    S.src.connect(S.analyser);
    S.analyser.connect(S.ctx.destination);
  }
  if (S.ctx.state === 'suspended') S.ctx.resume();
}

function loadTrack(i) {
  if (i < 0 || i >= S.tracks.length) return;
  S.curIdx = i;
  const t = S.tracks[i];
  S.audio.src = URL.createObjectURL(t.blob);
  S.audio.load();
  updateInfo();
  renderPanel();
  if (S.playing) S.audio.play().catch(()=>{});
}

function togglePlay() {
  if (!S.tracks.length) { toast('Add a song first', 'bad'); return; }
  initAudio();
  if (S.audio.paused) { S.audio.play(); S.playing = true; }
  else { S.audio.pause(); S.playing = false; }
  updatePlayBtn();
}

function nextTrack() {
  if (!S.tracks.length) return;
  let n = S.shuffle ? Math.floor(Math.random()*S.tracks.length) : (S.curIdx+1)%S.tracks.length;
  loadTrack(n); S.playing = true; updatePlayBtn(); S.audio.play().catch(()=>{});
}
function prevTrack() {
  if (!S.tracks.length) return;
  let p = S.shuffle ? Math.floor(Math.random()*S.tracks.length) : (S.curIdx-1+S.tracks.length)%S.tracks.length;
  loadTrack(p); S.playing = true; updatePlayBtn(); S.audio.play().catch(()=>{});
}

function updatePlayBtn() {
  const play = document.getElementById('iconPlay');
  const pause = document.getElementById('iconPause');
  if (S.playing && !S.audio.paused) { play.style.display='none'; pause.style.display='block'; }
  else { play.style.display='block'; pause.style.display='none'; }
}

function updateInfo() {
  const t = S.tracks[S.curIdx];
  document.getElementById('pTitle').textContent = t ? t.filename.replace(/\.[^/.]+$/,'') : 'No track selected';
  document.getElementById('pArtist').textContent = t ? 'Local' : 'Upload to begin';
}

function fmtDur(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ==================== UPLOAD ====================
async function handleFiles(files) {
  let added = 0;
  for (const f of files) {
    if (!f.name.match(/\.(mp3|wav|m4a|ogg|flac|webm)$/i)) {
      toast(`Skipped: ${f.name}`, 'bad'); continue;
    }
    try {
      const track = { filename: f.name, blob: f, createdAt: Date.now(), duration: 0 };
      const tmp = new Audio(); tmp.src = URL.createObjectURL(f);
      await new Promise(res => {
        tmp.onloadedmetadata = () => { track.duration = tmp.duration; URL.revokeObjectURL(tmp.src); res(); };
        tmp.onerror = () => res();
      });
      track.id = await dbAdd(track);
      S.tracks.push(track); added++;
    } catch(e) { toast(`Error: ${f.name}`, 'bad'); }
  }
  if (added) {
    toast(`${added} song${added>1?'s':''} added`, 'ok');
    renderPanel();
    updateSongsCount();
    if (S.curIdx === -1) loadTrack(0);
    document.getElementById('emptyState').classList.add('hide');
    document.getElementById('vizOverlay').classList.add('show');
  }
}

function updateSongsCount() {
  document.getElementById('songsCount').textContent = `(${S.tracks.length})`;
}

// ==================== PLAYLIST PANEL ====================
function renderPanel() {
  const box = document.getElementById('panelList');
  box.innerHTML = '';
  S.tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = `pl-item2${i===S.curIdx?' active':''}`;
    el.innerHTML = `<span class="pl-num2">${i+1}</span><div class="pl-info2"><div class="pl-name2">${t.filename.replace(/\.[^/.]+$/,'')}</div><div class="pl-dur2">${fmtDur(t.duration)}</div></div><button class="pl-del2" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    el.addEventListener('click', e => {
      if (e.target.closest('.pl-del2')) return;
      loadTrack(i); S.playing = true; updatePlayBtn(); S.audio.play().catch(()=>{});
      closePanel();
    });
    el.querySelector('.pl-del2').addEventListener('click', async e => {
      e.stopPropagation();
      await dbDel(t.id); S.tracks.splice(i,1);
      if (S.curIdx === i) {
        S.audio.pause(); S.playing = false; updatePlayBtn();
        if (S.tracks.length) loadTrack(Math.min(i, S.tracks.length-1));
        else { S.curIdx=-1; S.audio.src=''; updateInfo(); document.getElementById('emptyState').classList.remove('hide'); document.getElementById('vizOverlay').classList.remove('show'); }
      } else if (i < S.curIdx) S.curIdx--;
      renderPanel(); updateSongsCount();
    });
    box.appendChild(el);
  });
}

function openPanel() {
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}

// ==================== TOAST ====================
function toast(msg, type) {
  const box = document.getElementById('toastBox');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>',
    bad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };
  t.innerHTML = `${icons[type]||icons.info}<span class="toast-msg">${msg}</span>`;
  box.appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 350); }, 2600);
}

// ==================== CANVAS & VISUALIZERS ====================
const cvs = document.getElementById('vizCanvas');
const ctx = cvs.getContext('2d');
let W, H, DPR;

function sizeCanvas() {
  const rect = cvs.parentElement.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  cvs.width = W * DPR; cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function getData() {
  if (!S.analyser) return { f: new Uint8Array(0), t: new Uint8Array(0) };
  const f = new Uint8Array(S.analyser.frequencyBinCount);
  const t = new Uint8Array(S.analyser.frequencyBinCount);
  S.analyser.getByteFrequencyData(f);
  S.analyser.getByteTimeDomainData(t);
  return { f, t };
}

function avgf(arr, a, b) {
  let s = 0, n = 0;
  for (let i = a; i < b && i < arr.length; i++) { s += arr[i]; n++; }
  return n ? s / n : 0;
}

// ---- WAVE MESH ----
function drawWaveMesh(d, col) {
  const bass = avgf(d.f, 0, 10) / 255;
  const mid = avgf(d.f, 10, 60) / 255;
  const high = avgf(d.f, 60, 180) / 255;
  const energy = bass * 0.5 + mid * 0.3 + high * 0.2;
  const time = Date.now() * 0.0006;
  const cy = H / 2;
  const baseAmp = H * 0.18 * (0.4 + energy * 0.6);
  const points = 600;
  const master = new Float32Array(points);
  for (let i = 0; i < points; i++) {
    const nx = i / (points - 1);
    const phase = nx * Math.PI * 2 * 3.5 + time * 1.5;
    let y = Math.sin(phase) * 0.55;
    y += Math.sin(phase * 2.1 + 0.3) * 0.22;
    y += Math.sin(phase * 0.65 - time * 0.4) * 0.18;
    y += Math.sin(phase * 3.3 + 1.1) * 0.08 * mid;
    const env = 0.6 + 0.4 * Math.sin(nx * Math.PI * 1.3 + time * 0.3);
    y *= env;
    master[i] = y * baseAmp;
  }
  const layers = 28;
  const scales = [];
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const distFromCenter = Math.abs(t - 0.5) * 2;
    const scale = 1 + distFromCenter * 1.8;
    scales.push(scale);
  }
  for (let li = 0; li < layers; li++) {
    const scale = scales[li];
    const distFromCenter = Math.abs(li / (layers - 1) - 0.5) * 2;
    const isCenter = distFromCenter < 0.08;
    const alpha = 0.04 + (1 - distFromCenter) * 0.5;
    ctx.strokeStyle = isCenter ? col.p : col.s;
    ctx.lineWidth = isCenter ? 1.6 : 0.5;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = col.p;
    ctx.shadowBlur = isCenter ? 10 : 0;
    ctx.beginPath();
    for (let i = 0; i < points; i++) {
      const x = (i / (points - 1)) * W;
      const y = cy + master[i] * scale;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.strokeStyle = col.p;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.1 + energy * 0.08;
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.12 + energy * 0.18;
  ctx.shadowColor = col.p;
  ctx.shadowBlur = 14;
  ctx.beginPath();
  for (let i = 0; i < points; i++) {
    const x = (i / (points - 1)) * W;
    const y = cy + master[i];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// ---- OSCILLOSCOPE ----
function drawOscillo(d, col) {
  const bass = avgf(d.f, 0, 20) / 255;
  const cy = H / 2;
  const amb = ctx.createRadialGradient(W/2, cy, 0, W/2, cy, W * 0.4);
  amb.addColorStop(0, col.p + '05');
  amb.addColorStop(1, 'transparent');
  ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = col.p;
  ctx.lineWidth = 2;
  ctx.shadowColor = col.p;
  ctx.shadowBlur = 12 + bass * 18;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  const step = W / d.t.length;
  for (let i = 0; i < d.t.length; i++) {
    const v = d.t[i] / 128.0;
    const y = cy + (v - 1) * cy * 0.75;
    if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * step, y);
  }
  ctx.stroke();
  ctx.strokeStyle = col.s;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 6;
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  for (let i = 0; i < d.t.length; i++) {
    const v = d.t[i] / 128.0;
    const y = cy + (v - 1) * cy * 0.75 + Math.sin(i * 0.03) * 4;
    if (i === 0) ctx.moveTo(0, y); else ctx.lineTo(i * step, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// ---- FREQUENCY BARS (REDESIGNED + SLOPE/BEVEL) ----
function drawBars(d, col) {
  const N = 50;
  const gap = 3;
  const totalGap = (N + 1) * gap;
  const barW = (W - totalGap) / N;
  const maxH = H * 0.65;
  const minH = H * 0.02;

  if (!S.barState || S.barState.length !== N) {
    S.barState = new Float32Array(N);
  }

  const binCount = d.f.length;
  const usableBins = Math.floor(binCount * 0.7);
  
  const raw = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const logMin = Math.log(1);
    const logMax = Math.log(usableBins);
    const logVal = logMin + t * (logMax - logMin);
    const center = Math.exp(logVal);
    
    const windowStart = Math.floor(center * 0.85);
    const windowEnd = Math.ceil(center * 1.15);
    let sum = 0, count = 0;
    for (let b = windowStart; b <= windowEnd && b < usableBins; b++) {
      if (b >= 0) { sum += d.f[b]; count++; }
    }
    let val = count ? (sum / count) : 0;
    
    if (t < 0.20) {
      val *= 1.0 + (0.20 - t) * 1.5;
    }
    if (t > 0.75) {
      val *= 1.0 + (t - 0.75) * 1.2;
    }
    raw[i] = val;
  }

  let framePeak = 0;
  for (let i = 0; i < N; i++) if (raw[i] > framePeak) framePeak = raw[i];
  const normTarget = 220;
  const normFactor = framePeak > 10 ? (normTarget / framePeak) : 1;

  const attack = 0.35;
  const decay = 0.12;
  for (let i = 0; i < N; i++) {
    let target = raw[i] * normFactor;
    if (target > 255) target = 255;
    const curr = S.barState[i];
    if (target > curr) {
      S.barState[i] = curr + (target - curr) * attack;
    } else {
      S.barState[i] = curr + (target - curr) * decay;
    }
  }

  const smoothed = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let sum = S.barState[i] * 3;
    let div = 3;
    if (i > 0) { sum += S.barState[i-1]; div++; }
    if (i < N-1) { sum += S.barState[i+1]; div++; }
    smoothed[i] = sum / div;
  }

  for (let i = 0; i < N; i++) {
    const val = smoothed[i];
    const norm = val / 255;
    const h = minH + norm * (maxH - minH);
    const x = gap + i * (barW + gap);
    const y = H - h;
    const intensity = norm;
    const r = Math.min(barW / 2, 3);

    // 1. Main bar body with vertical gradient
    const g = ctx.createLinearGradient(x, H, x, y);
    g.addColorStop(0, col.p);
    g.addColorStop(0.50, col.s);
    g.addColorStop(1, `rgba(255,255,255,${0.32 + intensity * 0.42})`);

    ctx.fillStyle = g;
    ctx.shadowColor = col.p;
    ctx.shadowBlur = intensity > 0.55 ? 10 : 0;

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + barW, y, x + barW, y + r, r);
    ctx.lineTo(x + barW, H);
    ctx.lineTo(x, H);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 2. STEEP SLOPE: strong left-edge bevel highlight (creates 3D depth)
    if (barW > 2) {
      const bevelW = Math.max(1.2, barW * 0.28);
      ctx.fillStyle = `rgba(255,255,255,${0.14 + intensity * 0.22})`;
      ctx.beginPath();
      ctx.moveTo(x, H);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + bevelW, y, r);
      ctx.lineTo(x + bevelW, H);
      ctx.closePath();
      ctx.fill();
    }

    // 3. Right-edge dark slope shadow (complements the left bevel)
    if (barW > 3) {
      const shadowW = Math.max(1, barW * 0.18);
      ctx.fillStyle = `rgba(0,0,0,${0.18 + intensity * 0.12})`;
      ctx.beginPath();
      ctx.moveTo(x + barW, H);
      ctx.lineTo(x + barW, y + r);
      ctx.arcTo(x + barW, y, x + barW - shadowW, y, r);
      ctx.lineTo(x + barW - shadowW, H);
      ctx.closePath();
      ctx.fill();
    }

    // 4. Top cap steep white highlight (peak slope)
    if (h > minH * 2) {
      ctx.fillStyle = `rgba(255,255,255,${0.10 + intensity * 0.20})`;
      const capH = Math.min(3 + intensity * 4, h * 0.25);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + barW, y, x + barW, y + capH, r);
      ctx.lineTo(x + barW, y + capH);
      ctx.lineTo(x, y + capH);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Reflection
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.scale(1, -0.25);
  ctx.translate(0, -H * 3.8);
  for (let i = 0; i < N; i += 2) {
    const val = smoothed[i];
    const norm = val / 255;
    const h = minH + norm * (maxH - minH) * 0.6;
    const x = gap + i * (barW + gap);
    ctx.fillStyle = col.p;
    ctx.fillRect(x, H - h, barW, h);
  }
  ctx.restore();
}

// ---- PARTICLES ----
function drawParticles(d, col) {
  const bass = avgf(d.f, 0, 15) / 255;
  const mid = avgf(d.f, 15, 80) / 255;
  const high = avgf(d.f, 80, 200) / 255;
  const time = Date.now() * 0.001;
  const energy = bass * 0.5 + mid * 0.3 + high * 0.2;

  if (!S.particles.length) {
    for (let i = 0; i < 100; i++) {
      S.particles.push({
        x: Math.random() * W, y: Math.random() * H,
        baseX: Math.random() * W, baseY: Math.random() * H,
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.7,
        sz: 0.7 + Math.random() * 1.1
      });
    }
  }

  const amb = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.5);
  amb.addColorStop(0, col.p + '04');
  amb.addColorStop(1, 'transparent');
  ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H);

  S.particles.forEach(p => {
    const beatRadius = 15 + bass * 60;
    const orbitSpeed = p.speed * (1 + bass * 3);
    const angle = time * orbitSpeed + p.phase;
    p.x = p.baseX + Math.cos(angle) * beatRadius + Math.sin(angle * 2.3) * (mid * 20);
    p.y = p.baseY + Math.sin(angle) * beatRadius * 0.6 + Math.cos(angle * 1.7) * (high * 15);
    if (p.x < -10) { p.x = W + 10; p.baseX = p.x; }
    if (p.x > W + 10) { p.x = -10; p.baseX = p.x; }
    if (p.y < -10) { p.y = H + 10; p.baseY = p.y; }
    if (p.y > H + 10) { p.y = -10; p.baseY = p.y; }
    const sz = p.sz * (0.8 + energy * 0.8);
    const alpha = 0.3 + energy * 0.5;
    ctx.fillStyle = (energy > 0.72) ? '#ffffff' : col.p;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = col.p;
    ctx.shadowBlur = sz > 2.0 ? 6 : 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, Math.PI * 2); ctx.fill();
  });
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  ctx.strokeStyle = col.s;
  ctx.lineWidth = 0.35;
  for (let i = 0; i < S.particles.length; i += 2) {
    for (let j = i + 2; j < S.particles.length; j += 3) {
      const dx = S.particles[i].x - S.particles[j].x;
      const dy = S.particles[i].y - S.particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const threshold = 70 + mid * 50;
      if (dist < threshold) {
        ctx.globalAlpha = (1 - dist / threshold) * 0.15;
        ctx.beginPath();
        ctx.moveTo(S.particles[i].x, S.particles[i].y);
        ctx.lineTo(S.particles[j].x, S.particles[j].y);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

// ---- FOURIER WAVE ----
function drawFourier(d, col) {
  const bass = avgf(d.f, 0, 12) / 255;
  const mid = avgf(d.f, 12, 60) / 255;
  const high = avgf(d.f, 60, 180) / 255;
  const energy = bass * 0.4 + mid * 0.35 + high * 0.25;
  const time = Date.now() * 0.001;
  const cy = H / 2;
  const baseAmp = H * 0.14 * (0.4 + energy * 0.6);
  const amb = ctx.createRadialGradient(W/2, cy, 0, W/2, cy, W * 0.45);
  amb.addColorStop(0, col.p + '05');
  amb.addColorStop(1, 'transparent');
  ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H);
  const points = 600;
  const master = new Float32Array(points);
  for (let i = 0; i < points; i++) {
    const nx = i / (points - 1);
    const phase = nx * Math.PI * 2 * 3 + time * 1.2;
    let y = Math.sin(phase) * 0.5;
    y += Math.sin(phase * 2 + 0.4) * 0.2 * (0.5 + mid);
    y += Math.sin(phase * 3 - 0.3) * 0.1 * (0.5 + high);
    y += Math.sin(phase * 5 + 0.8) * 0.06 * bass;
    y += Math.sin(phase * 0.5 + time * 0.3) * 0.15 * bass;
    const env = 0.65 + 0.35 * Math.sin(nx * Math.PI * 1.2 + time * 0.25);
    y *= env;
    master[i] = y * baseAmp;
  }
  const layers = 18;
  const scales = [];
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const distFromCenter = Math.abs(t - 0.5) * 2;
    const scale = 1 + distFromCenter * 1.5;
    scales.push(scale);
  }
  for (let li = 0; li < layers; li++) {
    const scale = scales[li];
    const distFromCenter = Math.abs(li / (layers - 1) - 0.5) * 2;
    const isCenter = distFromCenter < 0.1;
    const alpha = 0.05 + (1 - distFromCenter) * 0.45;
    ctx.strokeStyle = isCenter ? col.p : col.s;
    ctx.lineWidth = isCenter ? 1.8 : 0.6;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = col.p;
    ctx.shadowBlur = isCenter ? 8 : 0;
    ctx.beginPath();
    for (let i = 0; i < points; i++) {
      const x = (i / (points - 1)) * W;
      const y = cy + master[i] * scale;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.strokeStyle = col.p;
  ctx.lineWidth = 0.4;
  ctx.globalAlpha = 0.08 + energy * 0.08;
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.1 + energy * 0.15;
  ctx.shadowColor = col.p;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  for (let i = 0; i < points; i++) {
    const x = (i / (points - 1)) * W;
    const y = cy + master[i];
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// ---- RENDER LOOP ----
function loop() {
  S.af = requestAnimationFrame(loop);
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
  if (!S.tracks.length) return;
  const d = getData();
  const col = getColors();
  switch (S.mode) {
    case 'wavemesh': drawWaveMesh(d, col); break;
    case 'oscilloscope': drawOscillo(d, col); break;
    case 'bars': drawBars(d, col); break;
    case 'particles': drawParticles(d, col); break;
    case 'fourier': drawFourier(d, col); break;
  }
}

// ==================== EVENTS & INIT ====================
function bindEvents() {
  const addBtn = document.getElementById('addBtn');
  const fileIn = document.getElementById('fileIn');
  addBtn.addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', e => { if (e.target.files.length) handleFiles(Array.from(e.target.files)); e.target.value = ''; });

  const vizWrap = document.querySelector('.viz-wrap');
  vizWrap.addEventListener('dragover', e => { e.preventDefault(); vizWrap.style.background = 'rgba(16,185,129,0.02)'; });
  vizWrap.addEventListener('dragleave', () => { vizWrap.style.background = ''; });
  vizWrap.addEventListener('drop', e => {
    e.preventDefault(); vizWrap.style.background = '';
    if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
  });

  document.getElementById('songsBtn').addEventListener('click', openPanel);
  document.getElementById('panelX').addEventListener('click', closePanel);
  document.getElementById('panelOverlay').addEventListener('click', closePanel);

  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnNext').addEventListener('click', nextTrack);
  document.getElementById('btnPrev').addEventListener('click', prevTrack);

  const shuf = document.getElementById('btnShuffle');
  shuf.addEventListener('click', () => { S.shuffle = !S.shuffle; shuf.classList.toggle('active', S.shuffle); shuf.style.color = S.shuffle ? 'var(--accent)' : ''; });
  const rep = document.getElementById('btnRepeat');
  rep.addEventListener('click', () => { S.repeat = !S.repeat; rep.classList.toggle('active', S.repeat); rep.style.color = S.repeat ? 'var(--accent)' : ''; });

  S.audio.addEventListener('ended', () => { if (S.repeat) { S.audio.currentTime = 0; S.audio.play(); } else nextTrack(); });
  S.audio.addEventListener('timeupdate', () => {
    const cur = S.audio.currentTime || 0, dur = S.audio.duration || 1;
    document.getElementById('txtCurr').textContent = fmtDur(cur);
    document.getElementById('txtTot').textContent = fmtDur(dur);
    document.getElementById('pFill').style.width = `${(cur/dur)*100}%`;
  });
  S.audio.addEventListener('play', () => { S.playing = true; updatePlayBtn(); });
  S.audio.addEventListener('pause', () => { S.playing = false; updatePlayBtn(); });

  const pBar = document.getElementById('pBar');
  pBar.addEventListener('click', e => {
    const rect = pBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (S.audio.duration) S.audio.currentTime = pct * S.audio.duration;
  });

  function setupDD(btnId, ddId, itemSel, cb) {
    const btn = document.getElementById(btnId);
    const dd = document.getElementById(ddId);
    const items = dd.querySelectorAll(itemSel);
    btn.addEventListener('click', e => { e.stopPropagation(); document.querySelectorAll('.dropdown').forEach(d => { if (d !== dd) d.classList.remove('open'); }); dd.classList.toggle('open'); });
    items.forEach(it => {
      it.addEventListener('click', () => {
        items.forEach(i => i.classList.remove('active')); it.classList.add('active'); dd.classList.remove('open');
        cb(it.dataset.mode || it.dataset.theme);
      });
    });
  }

  setupDD('btnViz', 'ddViz', '[data-mode]', mode => {
    S.mode = mode;
    const names = { wavemesh: 'Wave Mesh', oscilloscope: 'Oscilloscope', bars: 'Frequency Bars', particles: 'Particles', fourier: 'Fourier Wave' };
    document.getElementById('vizName').textContent = names[mode];
  });

  setupDD('btnTheme', 'ddTheme', '[data-theme]', theme => {
    S.theme = theme;
    const colors = getColors();
    document.documentElement.style.setProperty('--accent', colors.p);
    document.documentElement.style.setProperty('--accent2', colors.s);
    updateLogoColor(colors);
  });

  document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open')));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': prevTrack(); break;
      case 'ArrowRight': nextTrack(); break;
      case 'KeyF': e.preventDefault(); if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); break;
    }
  });

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(sizeCanvas, 120); });
}

function initEmpty() {
  const box = document.getElementById('emptyWave');
  for (let i = 0; i < 14; i++) {
    const bar = document.createElement('div');
    bar.className = 'ew-bar';
    bar.style.height = `${14 + Math.random() * 55}%`;
    bar.style.animationDelay = `${i * 0.1}s`;
    bar.style.animationDuration = `${1.3 + Math.random() * 0.7}s`;
    box.appendChild(bar);
  }
}

async function boot() {
  initEmpty();
  sizeCanvas();
  bindEvents();
  updateLogoColor(THEMES.emerald);

  try {
    await openDB();
    dbClean();
    const tracks = await dbAll();
    for (const t of tracks) {
      try {
        const tmp = new Audio(); tmp.src = URL.createObjectURL(t.blob);
        await new Promise(res => {
          tmp.onloadedmetadata = () => { t.duration = tmp.duration; URL.revokeObjectURL(tmp.src); res(); };
          tmp.onerror = () => res();
        });
        S.tracks.push(t);
      } catch(e) {}
    }
    renderPanel();
    updateSongsCount();
    if (S.tracks.length) {
      loadTrack(0);
      document.getElementById('emptyState').classList.add('hide');
      document.getElementById('vizOverlay').classList.add('show');
    }
  } catch(e) {
    toast('Storage unavailable. Using memory only.', 'info');
  }

  loop();
  setTimeout(() => document.getElementById('loader').classList.add('done'), 1400);
}

boot();
</script>
