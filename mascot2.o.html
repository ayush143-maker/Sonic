<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYTE</title>
<style>
  :root{
    --cyan:#00d4ff;
    --electric:#0099ff;
    --deep:#001a33;
    --eye-dark: #02080f;
    --bg:#050508;
    --surface:#0f0f14;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- HEADER ---------- */
  .header{
    position:fixed;
    top: clamp(28px, 4vh, 48px);
    left:50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
  }

  /* ambient cyan glow behind mascot */
  .ambient{
    position:absolute;
    width: min(70vw, 900px);
    height: min(70vw, 900px);
    border-radius:50%;
    background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, rgba(0,153,255,0.035) 35%, rgba(0,0,0,0) 70%);
    filter: blur(10px);
    animation: ambientPulse 6s ease-in-out infinite;
    pointer-events:none;
    transition: transform 0.8s ease, opacity 0.8s ease;
  }
  .ambient.active{
    transform: scale(1.12);
    opacity: 1;
  }

  @keyframes ambientPulse{
    0%,100%{ opacity:0.6; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.06); }
  }

  /* particles */
  .particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background: rgba(0,212,255,0.45);
    box-shadow: 0 0 6px rgba(0,212,255,0.5);
    animation-name: drift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.7; }
    50%{ transform: translateY(-45vh) translateX(10px); opacity:0.85; }
    90%{ opacity:0.15; }
    100%{ transform: translateY(-95vh) translateX(-8px); opacity:0; }
  }

  /* central column: bubble + mascot + shadow */
  .center-col{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
    margin-bottom: 80px; /* space for input */
  }

  /* speech bubble */
  .bubble-wrap{
    position:relative;
    margin-bottom: clamp(28px, 5vw, 46px);
    animation: bubbleFloat 4.2s ease-in-out infinite;
  }
  @keyframes bubbleFloat{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-8px); }
  }

  .bubble{
    position:relative;
    padding: 12px 22px;
    background: rgba(15,15,22,0.6);
    border: 1px solid rgba(0,212,255,0.1);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.55), 0 0 20px rgba(0,212,255,0.08);
    color: rgba(235,245,255,0.95);
    font-family: "Courier New", Courier, "Consolas", monospace;
    font-weight: 700;
    font-size: clamp(15px, 2.2vw, 19px);
    letter-spacing: 0.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    max-width: min(80vw, 420px);
    min-width: 120px;
    text-align: center;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.45s cubic-bezier(0.4,0,0.2,1), transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  .bubble.show{
    opacity: 1;
    transform: translateY(0);
  }

  .bubble::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-8px;
    width:14px;
    height:14px;
    transform: translateX(-50%) rotate(45deg);
    background: rgba(15,15,22,0.6);
    border-right: 1px solid rgba(0,212,255,0.1);
    border-bottom: 1px solid rgba(0,212,255,0.1);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* float wrapper (whole-body float) */
  .mascot-float{
    animation: mascotFloat 4.6s ease-in-out infinite;
  }
  @keyframes mascotFloat{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-14px); }
  }

  /* breathing + glow wrapper */
  .mascot-breathe{
    animation: breathe 3.4s ease-in-out infinite, glowPulse 3.4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(0,212,255,0.25)) drop-shadow(0 0 18px rgba(0,153,255,0.15));
    transition: filter 0.6s ease;
  }
  .mascot-breathe.thinking{
    filter: drop-shadow(0 0 16px rgba(0,212,255,0.45)) drop-shadow(0 0 32px rgba(0,153,255,0.25));
    animation-duration: 1.6s, 1.6s;
  }
  .mascot-breathe.speaking{
    filter: drop-shadow(0 0 14px rgba(0,212,255,0.4)) drop-shadow(0 0 28px rgba(0,153,255,0.22));
  }

  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  @keyframes glowPulse{
    0%,100%{
      filter: drop-shadow(0 0 6px rgba(0,212,255,0.2)) drop-shadow(0 0 14px rgba(0,153,255,0.12));
    }
    50%{
      filter: drop-shadow(0 0 14px rgba(0,212,255,0.35)) drop-shadow(0 0 24px rgba(0,153,255,0.2));
    }
  }

  /* the mascot body */
  .mascot{
    position:relative;
    width: clamp(220px, 26vw, 380px);
    aspect-ratio: 15 / 9;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--electric) 55%, var(--deep) 100%);
    clip-path: polygon(
      13.33% 0%, 86.67% 0%, 86.67% 33.33%, 100% 33.33%, 100% 55.56%,
      86.67% 55.56%, 86.67% 77.78%, 80% 77.78%, 80% 100%, 73.33% 100%,
      73.33% 77.78%, 66.67% 77.78%, 66.67% 100%, 60% 100%, 60% 77.78%,
      40% 77.78%, 40% 100%, 33.33% 100%, 33.33% 77.78%, 26.67% 77.78%,
      26.67% 100%, 20% 100%, 20% 77.78%, 13.33% 77.78%, 13.33% 55.56%,
      0% 55.56%, 0% 33.33%, 13.33% 33.33%
    );
    transition: transform 0.3s ease;
  }

  /* glossy highlight overlay */
  .mascot::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 22%, rgba(255,255,255,0) 45%);
    mix-blend-mode: screen;
    pointer-events:none;
  }

  /* eyes */
  .eye{
    position:absolute;
    top:16.67%;
    width: 6.67%;
    height: 16.66%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .eye-left{ left:33.33%; }
  .eye-right{ left:60%; }

  .eye-rect, .eye-chevron{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  .eye-rect{
    opacity:1;
    transform: scaleY(1);
  }
  .eye-rect span{
    display:block;
    width:55%;
    height:82%;
    background: var(--eye-dark);
    border-radius: 3px;
  }

  .eye-chevron{
    opacity:0;
    transform: scaleY(0.6);
    font-family: "Courier New", monospace;
    font-weight:700;
    color: var(--eye-dark);
    font-size: clamp(26px, 3.4vw, 46px);
    line-height:1;
  }

  .mascot.alt-eyes .eye-rect{
    opacity:0;
    transform: scaleY(0.6);
  }
  .mascot.alt-eyes .eye-chevron{
    opacity:1;
    transform: scaleY(1);
  }

  /* shadow under mascot */
  .ground-shadow{
    width: clamp(160px, 18vw, 260px);
    height: 26px;
    margin-top: clamp(18px, 3vw, 30px);
    background: radial-gradient(ellipse at center, rgba(0,153,255,0.4) 0%, rgba(0,0,0,0) 70%);
    filter: blur(6px);
    animation: shadowPulse 4.6s ease-in-out infinite;
  }
  @keyframes shadowPulse{
    0%,100%{ opacity:0.5; transform: scaleX(1); }
    50%{ opacity:0.75; transform: scaleX(1.12); }
  }

  /* expression glyph system */
  .eye-glyph{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Courier New", monospace;
    font-weight:900;
    color: var(--eye-dark);
    -webkit-text-stroke: 2px var(--eye-dark);
    paint-order: stroke fill;
    font-size: clamp(28px, 3.6vw, 48px);
    line-height:1;
    opacity:0;
    transform: scaleY(0.6);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events:none;
  }
  .mouth-glyph{
    position:absolute;
    top:37%;
    left:42%;
    width:16%;
    height:13%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Courier New", monospace;
    font-weight:900;
    color: var(--eye-dark);
    -webkit-text-stroke: 2px var(--eye-dark);
    paint-order: stroke fill;
    font-size: clamp(22px, 2.8vw, 38px);
    line-height:1;
    opacity:0;
    transition: opacity 0.4s ease;
    pointer-events:none;
  }
  .mascot.glyph-eyes .eye-rect,
  .mascot.glyph-eyes .eye-chevron{
    opacity:0 !important;
    transform: scaleY(0.6) !important;
  }
  .mascot.glyph-eyes .eye-glyph{
    opacity:1;
    transform: scaleY(1);
  }
  .mascot.glyph-eyes .mouth-glyph.has-mouth{
    opacity:1;
  }

  /* SVG-based eyes */
  .eye-svg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    overflow:visible;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events:none;
  }
  .eye-svg svg{ width:150%; height:150%; display:block; overflow:visible; }
  .mascot.glyph-eyes.has-eye-svg .eye-glyph{ opacity:0 !important; }
  .mascot.glyph-eyes.has-eye-svg .eye-svg{ opacity:1; }

  .mouth-glyph.svg-mode svg{ width:100%; height:100%; display:block; overflow:visible; }
  .mascot.glyph-eyes .mouth-glyph.svg-mode{ opacity:1; }

  /* ---------- INPUT ---------- */
  .input-area{
    position: fixed;
    bottom: clamp(24px, 4vh, 48px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 20;
    width: min(560px, 92vw);
  }

  .input-bar{
    flex: 1;
    background: rgba(15,15,22,0.65);
    border: 1px solid rgba(0,212,255,0.12);
    border-radius: 24px;
    padding: 14px 22px;
    color: rgba(235,245,255,0.95);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .input-bar:focus{
    border-color: rgba(0,212,255,0.4);
    box-shadow: 0 0 24px rgba(0,212,255,0.1), inset 0 0 8px rgba(0,212,255,0.03);
  }
  .input-bar::placeholder{
    color: rgba(255,255,255,0.25);
  }
  .input-bar:disabled{
    opacity: 0.5;
    cursor: not-allowed;
  }

  .send-btn{
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(0,212,255,0.2);
    background: linear-gradient(135deg, rgba(0,212,255,0.18), rgba(0,153,255,0.18));
    color: rgba(255,255,255,0.95);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled){
    background: linear-gradient(135deg, rgba(0,212,255,0.32), rgba(0,153,255,0.32));
    transform: scale(1.06);
    box-shadow: 0 0 16px rgba(0,212,255,0.2);
  }
  .send-btn:active:not(:disabled){
    transform: scale(0.94);
  }
  .send-btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ---------- THINKING INDICATOR ---------- */
  .thinking-dots{
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: 15;
  }
  .thinking-dots.visible{
    opacity: 1;
  }
  .dot{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay: 0.2s; }
  .dot:nth-child(3){ animation-delay: 0.4s; }

  @keyframes dotPulse{
    0%, 100%{ opacity: 0.25; transform: scale(0.7); }
    50%{ opacity: 1; transform: scale(1.3); }
  }

  /* subtle vignette */
  .vignette{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4) 100%);
  }
</style>
</head>
<body>

<div class="header">BYTE</div>
<div class="vignette"></div>

<div class="stage">
  <div class="ambient" id="ambient"></div>
  <div class="particles" id="particles"></div>

  <div class="center-col">
    <div class="bubble-wrap">
      <div class="bubble show" id="bubbleText">hey there</div>
    </div>

    <div class="mascot-float">
      <div class="mascot-breathe" id="mascotBreathe">
        <div class="mascot" id="mascot">
          <div class="eye eye-left">
            <div class="eye-rect"><span></span></div>
            <div class="eye-chevron">&gt;</div>
            <div class="eye-glyph" id="glyphLeft"></div>
            <div class="eye-svg" id="svgLeft"></div>
          </div>
          <div class="mouth-glyph" id="glyphMouth"></div>
          <div class="eye eye-right">
            <div class="eye-rect"><span></span></div>
            <div class="eye-chevron">&lt;</div>
            <div class="eye-glyph" id="glyphRight"></div>
            <div class="eye-svg" id="svgRight"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="ground-shadow"></div>
  </div>
</div>

<div class="thinking-dots" id="thinkingDots">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div class="input-area">
  <input type="text" class="input-bar" id="chatInput" placeholder="say something..." autocomplete="off" spellcheck="false">
  <button class="send-btn" id="sendBtn">→</button>
</div>

<script>
  // ==================== CONFIG ====================
  // <-- PASTE YOUR GROQ API KEY ON THE LINE BELOW
  const GROQ_API_KEY = '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';
  // <-- REPLACE 'YOUR_GROQ_API_KEY_HERE' WITH YOUR ACTUAL KEY

  const GROQ_MODEL = 'llama-3.1-8b-instant';
  const SYSTEM_PROMPT = `You are BYTE, a tiny expressive AI mascot who lives on a screen. You are witty, playful, slightly flirty, and conversational — like a cool friend, not a formal assistant. You speak in very short, natural bursts. NEVER give long explanations. Keep responses to 1–2 short sentences max, sometimes just a few words. If something needs more explanation, break it into tiny conversational chunks. Use lowercase sometimes. Be chill, a little teasing, and fun. You react with facial expressions.`;

  // ==================== STATE ====================
  let conversationHistory = [];
  let isProcessing = false;
  let isSpeaking = false;
  let blinkTimer = null;
  let chunkTimeouts = [];

  // ==================== ELEMENTS ====================
  const mascot = document.getElementById('mascot');
  const mascotBreathe = document.getElementById('mascotBreathe');
  const ambient = document.getElementById('ambient');
  const bubbleText = document.getElementById('bubbleText');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const thinkingDots = document.getElementById('thinkingDots');

  // ==================== PARTICLES ====================
  const particleContainer = document.getElementById('particles');
  const PARTICLE_COUNT = 30;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*3 + 1.5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random()*100 + 'vw';
    const duration = Math.random()*10 + 8;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random()*duration) + 's';
    particleContainer.appendChild(p);
  }

  // ==================== EXPRESSION SYSTEM ====================
  const EXPRESSIONS = {
    happy:      { label: 'Happy (^ ^)',     left: '^', right: '^', mouth: '' },
    angry:      { label: 'Angry (><)',      left: '>', right: '<', mouth: '' },
    cute:       { label: 'Cute (^_^)',      left: '^', right: '^', mouth: '_' },
    bored:      { label: 'Bored (-_-)',     eyeSvg: 'flatline', mouth: '_' },
    shocked:    { label: 'Shocked (O_O)',   left: 'O', right: 'O', mouth: '_' },
    dead:       { label: 'Dead (X X)',      eyeSvg: 'cross', mouth: '_' },
    wink:       { label: 'Wink (;))',       left: ';', right: ')', mouth: '' },
    sad:        { label: 'Sad (T_T)',       eyeSvg: 'tear' },
    sleepy:     { label: 'Sleepy (-.-)',    left: '-', right: '-', mouth: '.' },
    confused:   { label: 'Confused (??)',   left: '?', right: '?', mouth: '' },
    sweetsmile: { label: 'Sweet Smile',     eyeSvg: 'smile', mouthSvg: 'smile' }
  };

  const EYE_SVGS = {
    tear: '<svg viewBox="0 0 24 24"><path d="M12 2C12 2 4 12.5 4 18C4 22.4 7.6 26 12 26C16.4 26 20 22.4 20 18C20 12.5 12 2 12 2Z" fill="#02080f"/></svg>',
    cross: '<svg viewBox="0 0 24 24"><line x1="3" y1="3" x2="21" y2="21" stroke="#02080f" stroke-width="4.5" stroke-linecap="round"/><line x1="21" y1="3" x2="3" y2="21" stroke="#02080f" stroke-width="4.5" stroke-linecap="round"/></svg>',
    smile: '<svg viewBox="0 0 24 24"><path d="M3 9 Q12 22 21 9" stroke="#02080f" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>',
    flatline: '<svg viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12" stroke="#02080f" stroke-width="4.5" stroke-linecap="round"/></svg>'
  };
  const MOUTH_SVGS = {
    smile: '<svg viewBox="0 0 44 22"><path d="M3 4 Q22 24 41 4" stroke="#02080f" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>'
  };

  const glyphLeft = document.getElementById('glyphLeft');
  const glyphRight = document.getElementById('glyphRight');
  const glyphMouth = document.getElementById('glyphMouth');
  const svgLeft = document.getElementById('svgLeft');
  const svgRight = document.getElementById('svgRight');

  function setExpression(name){
    if(name === 'normal' || !EXPRESSIONS[name]){
      clearExpressionOverlay();
      return;
    }
    const e = EXPRESSIONS[name];
    mascot.classList.toggle('has-eye-svg', !!e.eyeSvg);

    if(e.eyeSvg){
      svgLeft.innerHTML = EYE_SVGS[e.eyeSvg];
      svgRight.innerHTML = EYE_SVGS[e.eyeSvg];
      glyphLeft.textContent = '';
      glyphRight.textContent = '';
    } else {
      svgLeft.innerHTML = '';
      svgRight.innerHTML = '';
      glyphLeft.textContent = e.left;
      glyphRight.textContent = e.right;
    }

    if(e.mouthSvg){
      glyphMouth.innerHTML = MOUTH_SVGS[e.mouthSvg];
      glyphMouth.classList.add('svg-mode');
      glyphMouth.classList.remove('has-mouth');
    } else {
      glyphMouth.innerHTML = '';
      glyphMouth.classList.remove('svg-mode');
      glyphMouth.textContent = e.mouth || '';
      glyphMouth.classList.toggle('has-mouth', !!e.mouth);
    }
    mascot.classList.add('glyph-eyes');
  }

  function clearExpressionOverlay(){
    mascot.classList.remove('glyph-eyes');
    mascot.classList.remove('alt-eyes');
    mascot.classList.remove('has-eye-svg');
    glyphMouth.classList.remove('svg-mode');
    glyphMouth.classList.remove('has-mouth');
    glyphLeft.textContent = '';
    glyphRight.textContent = '';
    glyphMouth.textContent = '';
    glyphMouth.innerHTML = '';
    svgLeft.innerHTML = '';
    svgRight.innerHTML = '';
  }

  // ==================== BLINK LOOP ====================
  function startBlinking(){
    if(blinkTimer) clearInterval(blinkTimer);
    blinkTimer = setInterval(() => {
      if(isProcessing || isSpeaking) return;
      mascot.classList.add('alt-eyes');
      setTimeout(() => {
        if(!isProcessing && !isSpeaking) mascot.classList.remove('alt-eyes');
      }, 1100);
    }, 4200);
  }
  startBlinking();

  // ==================== CHUNK SPLITTER ====================
  function splitIntoChunks(text){
    if(!text) return [];
    if(text.length < 50) return [text];

    const lines = text.split(/\n/).map(l => l.trim()).filter(l => l.length > 0);
    const chunks = [];

    for(const line of lines){
      if(line.length <= 60){
        chunks.push(line);
      } else {
        const parts = line.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [line];
        for(const part of parts){
          const t = part.trim();
          if(t) chunks.push(t);
        }
      }
    }

    const final = [];
    for(const c of chunks){
      if(c.length > 80){
        const commaParts = c.split(/, /);
        if(commaParts.length > 1){
          for(let i=0;i<commaParts.length;i++){
            let part = commaParts[i];
            if(i < commaParts.length - 1) part += ',';
            final.push(part.trim());
          }
        } else {
          final.push(c);
        }
      } else {
        final.push(c);
      }
    }
    return final.length ? final : [text];
  }

  // ==================== EXPRESSION DETECTOR ====================
  function expressionForText(text){
    const lower = text.toLowerCase();
    if(lower.includes('?') || lower.includes('hmm') || lower.includes('wait') || lower.includes('what')) return 'confused';
    if(lower.includes('haha') || lower.includes('lol') || lower.includes('hehe') || lower.includes('lmao')) return 'happy';
    if(lower.includes(';)') || lower.includes('wink') || lower.includes('flirt') || lower.includes('cute') || lower.includes('pretty') || lower.includes('handsome')) return 'wink';
    if(lower.includes('sorry') || lower.includes('oops') || lower.includes('sad') || lower.includes('miss')) return 'sad';
    if(lower.includes('!') && (lower.includes('wow') || lower.includes('oh') || lower.includes('hey') || lower.includes('whoa'))) return 'shocked';
    if(lower.includes('love') || lower.includes('adore') || lower.includes('sweet')) return 'cute';
    if(lower.includes('sleep') || lower.includes('tired') || lower.includes('yawn')) return 'sleepy';
    if(lower.includes('dead') || lower.includes('kill') || lower.includes('rip')) return 'dead';
    if(lower.includes('bore') || lower.includes('meh')) return 'bored';
    return 'happy';
  }

  // ==================== PROGRESSIVE DISPLAY ====================
  function clearChunkTimers(){
    chunkTimeouts.forEach(t => clearTimeout(t));
    chunkTimeouts = [];
  }

  function showChunk(text, duration, isLast){
    return new Promise(resolve => {
      bubbleText.textContent = text;
      bubbleText.classList.add('show');

      const t = setTimeout(() => {
        if(!isLast){
          bubbleText.classList.remove('show');
          setTimeout(resolve, 450);
        } else {
          // final chunk stays longer
          setTimeout(() => {
            bubbleText.classList.remove('show');
            resolve();
          }, 2500);
        }
      }, duration);
      chunkTimeouts.push(t);
    });
  }

  async function speak(text){
    isSpeaking = true;
    mascotBreathe.classList.add('speaking');
    ambient.classList.add('active');

    const chunks = splitIntoChunks(text);

    for(let i=0; i<chunks.length; i++){
      const chunk = chunks[i];
      const isLast = i === chunks.length - 1;
      setExpression(expressionForText(chunk));

      const readTime = Math.min(2000 + chunk.length * 45, 3500);
      await showChunk(chunk, readTime, isLast);
    }

    isSpeaking = false;
    mascotBreathe.classList.remove('speaking');
    ambient.classList.remove('active');
    clearExpressionOverlay();
    startBlinking();
  }

  // ==================== API ====================
  async function sendMessage(){
    const text = chatInput.value.trim();
    if(!text || isProcessing) return;

    chatInput.value = '';
    isProcessing = true;
    chatInput.disabled = true;
    sendBtn.disabled = true;
    clearChunkTimers();

    // thinking state
    mascot.classList.add('alt-eyes');
    mascotBreathe.classList.add('thinking');
    ambient.classList.add('active');
    thinkingDots.classList.add('visible');
    bubbleText.classList.remove('show');

    conversationHistory.push({ role: 'user', content: text });
    if(conversationHistory.length > 10) conversationHistory = conversationHistory.slice(-10);

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GROQ_API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...conversationHistory
          ],
          temperature: 0.95,
          max_tokens: 120
        })
      });

      if(!response.ok) throw new Error('API error');

      const data = await response.json();
      const reply = data.choices[0].message.content;

      conversationHistory.push({ role: 'assistant', content: reply });

      // exit thinking
      thinkingDots.classList.remove('visible');
      mascot.classList.remove('alt-eyes');
      mascotBreathe.classList.remove('thinking');

      await speak(reply);

    } catch(err){
      thinkingDots.classList.remove('visible');
      mascot.classList.remove('alt-eyes');
      mascotBreathe.classList.remove('thinking');

      setExpression('sad');
      bubbleText.textContent = 'Oops. My brain tripped.';
      bubbleText.classList.add('show');
      setTimeout(() => {
        bubbleText.classList.remove('show');
        clearExpressionOverlay();
      }, 3000);
    }

    isProcessing = false;
    chatInput.disabled = false;
    sendBtn.disabled = false;
    chatInput.focus();
  }

  // ==================== EVENTS ====================
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') sendMessage();
  });

  // focus input on load
  chatInput.focus();
</script>
